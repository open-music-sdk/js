packages:
  - packages/*
  - clients/*
  - lib/*
  - integrations/*
  - apps/*
  - samples/*
  - codegen/*
  - tooling/*

# No install scripts run. esbuild (under VitePress's Vite and Wrangler) and workerd (the worker-server sample's
# runtime, under Wrangler) each find their binary in their platform package without one.
allowBuilds:
  esbuild: false
  workerd: false

# One version of every shared dependency for the whole repo.
catalog:
  # runtime / peers
  jose: ^6
  react: ^19
  react-dom: ^19
  next: ^16
  "@tanstack/react-query": ^5
  "@types/react": ^19
  "@types/react-dom": ^19
  # sample apps, which are never published
  express: ^5
  "@types/express": ^5
  vite: ^8
  wrangler: ^4
  # toolchain
  happy-dom: ^21
  eslint-plugin-react-hooks: ^7
  typescript: ~6.0.3
  turbo: ^2.11.7
  eslint: ^10.12.0
  "@eslint/js": ^10.0.1
  typescript-eslint: ^8.71.0
  globals: ^17.13.0
  tsdown: ^0.23.0
  vitest: ^4.0.0
  "@vitest/coverage-v8": ^4.0.0
  "@types/node": ^24
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.14.0
  typedoc-vitepress-theme: ^1.1.4
  vitepress: ^1.6.4
