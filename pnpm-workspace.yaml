packages:
  - packages/*
  - clients/*
  - lib/*
  - integrations/*
  - apps/*
  - codegen/*
  - tooling/*

# One version of every shared dependency for the whole repo.
catalog:
  # runtime / peers
  jose: ^6
  react: ^19
  next: ^16
  "@tanstack/react-query": ^5
  # toolchain
  typescript: ~6.0.3
  turbo: ^2.11.7
  eslint: ^10.12.0
  "@eslint/js": ^10.0.1
  typescript-eslint: ^8.71.0
  globals: ^17.13.0
  tsdown: ^0.23.0
  vitest: ^4.0.0
  "@changesets/cli": ^2.29.8
  "@types/node": ^24
