name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The docs build runs TypeDoc's checks and fails on a dead link or anchor, so `check`, the same checks without
      # the site, is left for local use.
      - run: pnpm turbo run build typecheck lint --affected
      # Test coverage is for the whole repo, so the tests are not --affected. They run on pull requests too, so that
      # Codecov can hold each one to codecov.yml.
      - run: pnpm turbo run test -- --coverage
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
